name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Run unit tests
        # Uses the installed Gradle directly: the Gradle wrapper jar is a
        # binary file and is not included in this initial push, so
        # ./gradlew cannot run until `gradle wrapper` regenerates it
        # on a normal machine. The Gradle version matches the wrapper.
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dexboost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
